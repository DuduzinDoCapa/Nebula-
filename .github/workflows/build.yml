name: Gerar APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar APK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          unzip -q NebulaHub.zip
          cd NebulaHub
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon 2>&1 | tee ../build.log
          exit ${PIPESTATUS[0]}
      - name: Mostrar erro
        if: failure()
        run: |
          grep -E "^e: |What went wrong|error:|ERROR|Exception|FAILED" -A3 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
      - uses: actions/upload-artifact@v4
        with:
          name: Nebula-APK
          path: NebulaHub/app/build/outputs/apk/release/*.apk
